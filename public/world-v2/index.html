<html lang="en">

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vice City Stories — Model Gallery</title>
<style>
[hidden]{display:none!important}
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101418;color:#eef1ef}*{box-sizing:border-box}body{margin:0}header{padding:28px 36px 20px;display:flex;justify-content:space-between;gap:24px;align-items:center;border-bottom:1px solid #2b3338}h1{font-size:25px;font-weight:600;letter-spacing:-.7px;margin:7px 0}small,.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#c0a884}header p{font-size:13px;color:#9da8ae;max-width:640px;margin:5px 0;line-height:1.5}.workspace{display:grid;grid-template-columns:245px 1fr;min-height:640px;height:calc(100vh - 143px)}aside{padding:24px 18px;border-right:1px solid #2b3338;overflow:auto}.category{font-size:10px;color:#8c999e;text-transform:uppercase;letter-spacing:2px;margin:12px 12px}button{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid transparent;border-radius:7px;background:transparent;padding:12px;margin:4px 0;color:#c2cbd0;font-size:13px;cursor:pointer}button:hover{background:#1b242b}button.active{background:#24343b;border-color:#3c6066;color:#effcfb}button span{font-size:10px;color:#8da1a8}main{position:relative;min-width:0;background:#191f23}canvas{display:block;width:100%;height:100%;touch-action:none}.info{position:absolute;top:28px;left:32px;pointer-events:none}.info h2{font-size:32px;font-weight:500;letter-spacing:-1px;margin:8px 0}.meta{display:flex;gap:20px;font-size:12px;color:#a4afb4}.hint{position:absolute;bottom:25px;left:32px;color:#a2afb5;font-size:12px}.download{position:absolute;bottom:22px;right:30px;color:#e6f6f3;background:#2b4b4a;padding:10px 15px;border-radius:5px;text-decoration:none;font-size:12px}.badge{border:1px solid #42504f;padding:7px 11px;border-radius:20px;color:#b8c6c5;font-size:11px;white-space:nowrap}.error{padding:40px;color:#ffb3a0}@media(max-width:700px){header{padding:18px;display:block}.badge{display:none}.workspace{grid-template-columns:155px 1fr;height:650px}aside{padding:12px 6px}.info{left:18px}.info h2{font-size:23px}.meta{display:block;line-height:1.8}.hint{left:18px;bottom:70px;max-width:150px}.download{right:16px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<header><div><div class="eyebrow">VICE CITY STORIES / ASSET REVIEW</div><h1>Your game’s model collection</h1><p>Free V1 characters, vehicles, and coastal environment.</p><a href="./world-v2.html" style="color:#d6ece4;font-size:12px">View coastal world images and research</a></div><div class="badge">V1 MODEL COLLECTION</div></header>
<div class="workspace"><aside id="list" aria-label="Choose a model"></aside><main id="stage"><canvas aria-label="Interactive 3D model. Drag to rotate and scroll to zoom."></canvas><div class="info"><small id="kind"></small><h2 id="name"></h2><div class="meta"><span id="triangles"></span><span id="size"></span></div></div><div class="hint">Drag to orbit · Scroll to zoom</div><a id="snapshot" class="download" style="bottom:66px" href="#">Save preview image</a><a id="download" class="download" download>Download 3D model ↗</a></main></div>
<script type="module" src="./gallery-app.js"></script>
</body></html>
